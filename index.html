<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Cluster HUD</title>
<style>
  /* =========================================================
     RESET
     ========================================================= */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --txt:   #e6f1ff;
    --dim:   #8ba0b8;
    --cyan:  #19e6ff;
    --blue:  #4aa8ff;
    --amber: #ffc247;
    --red:   #ff3b5c;
    --green: #25d07d;

    --line:      rgba(25, 230, 255, .5);
    --line-soft: rgba(25, 230, 255, .3);

    /* ===== BACKGROUND BIRU (TANPA HITAM) ===== */
    --bg-panel: rgba(15, 55, 120, .45);
    --bg-cell:  rgba(20, 70, 140, .4);
    --bg-chip:  rgba(25, 80, 155, .4);
    --bg-track: rgba(10, 35, 75, .6);

    /* ===== UKURAN & POSISI ===== */
    --hud-width:  380px;
    --hud-right:  18px;
    /* ⬆️ NAIKKAN POSISI BIAR GAK NABRAK UI BAWAAN GTA */
    --hud-bottom: 120px;
  }

  /* =========================================================
     ROOT
     ========================================================= */
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    background: transparent !important;
    background-color: transparent !important;
    background-image: none !important;

    color: var(--txt);
    font-family: 'Segoe UI', 'SF Pro Display', system-ui, sans-serif;

    overflow: hidden;
    pointer-events: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  html::before, html::after,
  body::before, body::after {
    content: none !important;
    display: none !important;
  }

  /* =========================================================
     SCENE — pojok kanan bawah (dinaikkan)
     ========================================================= */
  .scene {
    position: fixed;
    right: var(--hud-right);
    bottom: var(--hud-bottom);
    width: var(--hud-width);
    z-index: 9999;

    background: transparent !important;
    pointer-events: none;
  }

  /* =========================================================
     HUD PANEL — background BIRU, TANPA blur, TANPA shadow hitam
     ========================================================= */
  .hud {
    width: 100%;

    background: var(--bg-panel) !important;
    background-color: var(--bg-panel) !important;

    border: 1px solid var(--line);
    border-radius: 11px;

    padding: 7px;

    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 7px;

    position: relative;
    overflow: hidden;

    box-shadow:
      0 0 18px -4px rgba(25, 230, 255, .5),
      inset 0 0 16px -8px rgba(25, 230, 255, .35);
  }

  .hud.redline {
    border-color: rgba(255, 59, 92, .7);
    background: rgba(120, 25, 45, .45) !important;
    box-shadow:
      0 0 20px -4px rgba(255, 59, 92, .85),
      inset 0 0 16px -8px rgba(255, 59, 92, .4);
  }

  /* =========================================================
     BAR (top & bottom)
     ========================================================= */
  .hud-bar {
    display: flex;
    align-items: center;
    gap: 7px;

    padding: 6px 8px;

    background: var(--bg-cell) !important;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
  }

  .hud-bar--top {
    justify-content: space-between;
  }

  /* =========================================================
     SEIN KIRI / KANAN
     ========================================================= */
  .turn-signals {
    display: flex;
    gap: 5px;
  }

  .arrow {
    width: 22px;
    height: 22px;
    border-radius: 6px;

    background: rgba(10, 35, 75, .5) !important;
    border: 1px solid var(--line-soft);
    position: relative;
    transition: .2s;
  }

  .arrow::before {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    width: 0;
    height: 0;
    border-top: 4.5px solid transparent;
    border-bottom: 4.5px solid transparent;
  }

  .arrow.left::before {
    border-right: 8px solid var(--dim);
    transform: translateX(-1px);
  }

  .arrow.right::before {
    border-left: 8px solid var(--dim);
    transform: translateX(1px);
  }

  .arrow.active {
    background: rgba(25, 230, 255, .25) !important;
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(25, 230, 255, .9);
  }

  .arrow.left.active::before {
    border-right-color: var(--cyan);
    filter: drop-shadow(0 0 4px var(--cyan));
  }

  .arrow.right.active::before {
    border-left-color: var(--cyan);
    filter: drop-shadow(0 0 4px var(--cyan));
  }

  /* =========================================================
     SEATBELT WARNING
     ========================================================= */
  .seatbelt-warning {
    display: none;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 5px;

    background: rgba(255, 59, 92, .25) !important;
    border: 1px solid rgba(255, 59, 92, .85);

    color: #ffe6ea;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1.1px;
    text-shadow: 0 0 6px rgba(255, 59, 92, 1);
    box-shadow: 0 0 12px -2px rgba(255, 59, 92, .85);

    animation: blink 1s steps(2, start) infinite;
  }

  .seatbelt-warning.show {
    display: flex;
  }

  .seatbelt-warning .icon {
    font-size: 10px;
  }

  @keyframes blink {
    50% { opacity: .35; }
  }

  /* =========================================================
     CHIPS
     ========================================================= */
  .chips {
    display: flex;
    gap: 4px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3.5px 8px;
    border-radius: 999px;

    background: var(--bg-chip) !important;
    border: 1px solid var(--line-soft);

    color: var(--dim);
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 1px;

    transition: .25s;
  }

  .chip i {
    width: 5.5px;
    height: 5.5px;
    border-radius: 50%;
    background: #3a4b63;
    transition: .25s;
  }

  .chip.active {
    color: #e9ffff;
    border-color: rgba(25, 230, 255, 1);
    background: rgba(25, 230, 255, .25) !important;
    text-shadow: 0 0 6px rgba(25, 230, 255, 1);
    box-shadow:
      0 0 12px -2px rgba(25, 230, 255, .95),
      inset 0 0 8px -3px rgba(25, 230, 255, .6);
  }

  .chip.active i {
    background: var(--cyan);
    box-shadow: 0 0 7px var(--cyan);
  }

  .chip.warn {
    border-color: rgba(255, 59, 92, .85);
    color: #ffe6ea;
    background: rgba(255, 59, 92, .2) !important;
    box-shadow: 0 0 12px -2px rgba(255, 59, 92, .85);
  }

  .chip.warn i {
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
  }

  /* =========================================================
     TENGAH : SPEED + RPM
     ========================================================= */
  .hud-mid {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 7px;
  }

  .cell {
    background: var(--bg-cell) !important;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 8px 9px;
    position: relative;
    overflow: hidden;
  }

  .cell-label {
    font-size: 8px;
    letter-spacing: 1.6px;
    color: #a8c4e0;
    font-weight: 800;
    margin-bottom: 3px;
    text-shadow: 0 0 4px rgba(0, 0, 0, .9);
  }

  /* ---------- SPEED ---------- */
  .speed-cell {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 92px;
  }

  .speed-num {
    font-size: 46px;
    font-weight: 800;
    line-height: .95;
    letter-spacing: -1.8px;

    background: linear-gradient(180deg, #ffffff 0%, #7fdcff 60%, #19e6ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    filter:
      drop-shadow(0 0 10px rgba(25, 230, 255, 1))
      drop-shadow(0 0 2px rgba(0, 0, 0, .95));

    font-variant-numeric: tabular-nums;
  }

  .speed-unit {
    margin-top: 1px;
    font-size: 9px;
    letter-spacing: 3px;
    color: #a8c4e0;
    font-weight: 800;
    text-shadow: 0 0 4px rgba(0, 0, 0, .9);
  }

  .speed-sub {
    margin-top: 3px;
    font-size: 8px;
    letter-spacing: 1.1px;
    color: #a8c4e0;
    text-shadow: 0 0 4px rgba(0, 0, 0, .9);
  }

  .speed-sub b {
    color: var(--cyan);
    font-weight: 800;
    text-shadow: 0 0 6px rgba(25, 230, 255, 1);
  }

  /* ---------- RPM ---------- */
  .rpm-cell {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .rpm-value {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.5px;
    color: #fff;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    text-shadow:
      0 0 9px rgba(25, 230, 255, .95),
      0 0 2px rgba(0, 0, 0, .95);
  }

  .rpm-value small {
    font-size: 7.5px;
    color: #a8c4e0;
    letter-spacing: 1.8px;
    font-weight: 700;
    margin-left: 4px;
    vertical-align: middle;
    text-shadow: 0 0 3px rgba(0, 0, 0, .9);
  }

  .rpm-bars {
    display: grid;
    grid-template-columns: repeat(20, 1fr);
    gap: 1.3px;
    margin-top: 6px;
    height: 12px;
  }

  .rpm-bars .seg {
    background: rgba(60, 100, 160, .4);
    border-radius: 1.5px;
    transition: .15s;
  }

  .rpm-bars .seg.on {
    background: linear-gradient(180deg, var(--cyan), var(--blue));
    box-shadow: 0 0 6px rgba(25, 230, 255, 1);
  }

  .rpm-bars .seg.red.on {
    background: linear-gradient(180deg, var(--amber), var(--red));
    box-shadow: 0 0 6px rgba(255, 59, 92, 1);
  }

  /* ---------- GEAR ---------- */
  .gear-box {
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px;

    background: rgba(10, 35, 75, .5) !important;
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    box-shadow: inset 0 0 10px -4px rgba(25, 230, 255, .6);
  }

  .gear-box .lbl {
    font-size: 8px;
    letter-spacing: 1.6px;
    color: #a8c4e0;
    font-weight: 800;
    text-shadow: 0 0 4px rgba(0, 0, 0, .9);
  }

  .gear-box .val {
    font-size: 17px;
    font-weight: 800;
    color: var(--cyan);
    letter-spacing: .4px;
    line-height: 1;
    text-shadow:
      0 0 10px rgba(25, 230, 255, 1),
      0 0 2px rgba(0, 0, 0, .95);
    min-width: 19px;
    text-align: center;
    display: inline-block;
  }

  .gear-box .val.pop {
    animation: gearPop .28s ease-out;
  }

  @keyframes gearPop {
    0%   { transform: scale(.7); }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* =========================================================
     BAR BAWAH : ODO + FUEL + HEALTH
     ========================================================= */
  .hud-bar--bottom {
    display: grid;
    grid-template-columns: auto 1fr 1fr;
    gap: 7px;
    align-items: center;
  }

  .odo {
    display: flex;
    align-items: baseline;
    gap: 3px;
    padding: 4px 8px;

    background: rgba(10, 35, 75, .5) !important;
    border: 1px solid var(--line-soft);
    border-radius: 6px;

    font-variant-numeric: tabular-nums;
  }

  .odo small {
    font-size: 7px;
    letter-spacing: 1.6px;
    color: #a8c4e0;
    font-weight: 800;
    text-shadow: 0 0 3px rgba(0, 0, 0, .9);
  }

  .odo span {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .5px;
    color: #fff;
    text-shadow:
      0 0 7px rgba(25, 230, 255, .9),
      0 0 2px rgba(0, 0, 0, .95);
  }

  .odo #vOdoUnit {
    color: #a8c4e0;
    font-weight: 700;
  }

  .meter {
    display: flex;
    flex-direction: column;
    gap: 2.5px;
    padding: 4px 8px;

    background: rgba(10, 35, 75, .5) !important;
    border: 1px solid var(--line-soft);
    border-radius: 6px;
  }

  .meter-head {
    display: flex;
    justify-content: space-between;
    align-items: center;

    font-size: 7px;
    letter-spacing: 1.6px;
    color: #a8c4e0;
    font-weight: 800;
    text-shadow: 0 0 3px rgba(0, 0, 0, .9);
  }

  .meter-head b {
    color: #fff;
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
    text-shadow: 0 0 6px rgba(25, 230, 255, .8);
  }

  .track {
    height: 4px;
    background: var(--bg-track) !important;
    border-radius: 2px;
    overflow: hidden;
  }

  .fill {
    height: 100%;
    width: 0%;

    background: linear-gradient(90deg, var(--cyan), var(--blue));
    box-shadow: 0 0 8px rgba(25, 230, 255, 1);

    transition: width .3s ease;
  }

  .meter.health .fill {
    background: linear-gradient(90deg, var(--green), var(--cyan));
    box-shadow: 0 0 8px rgba(37, 208, 125, .95);
  }

  .meter.low .fill {
    background: linear-gradient(90deg, var(--amber), var(--red)) !important;
    box-shadow: 0 0 8px rgba(255, 59, 92, 1) !important;
  }

  .meter.low .meter-head b {
    color: var(--red);
    text-shadow: 0 0 6px rgba(255, 59, 92, 1);
  }

  /* =========================================================
     DATA SOURCE hidden
     ========================================================= */
  .data-source[hidden] {
    display: none !important;
  }

  /* =========================================================
     RESPONSIVE
     ========================================================= */
  @media (max-width: 900px) {
    :root {
      --hud-width: 330px;
      --hud-right: 14px;
      --hud-bottom: 110px;
    }
  }

  @media (max-width: 640px) {
    :root {
      --hud-width: 280px;
      --hud-right: 10px;
      --hud-bottom: 100px;
    }
    .speed-num { font-size: 36px; }
    .rpm-value { font-size: 18px; }
    .chip span { display: none; }
    .chip { padding: 2.5px 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<div class="scene">
  <main class="hud" id="hud">

    <!-- ================= BAR ATAS ================= -->
    <header class="hud-bar hud-bar--top">

      <div class="turn-signals">
        <span class="arrow left"  id="indLeft"></span>
        <span class="arrow right" id="indRight"></span>
      </div>

      <div class="seatbelt-warning" id="seatbeltWarning">
        <span class="icon">&#9888;</span>
        <span>SEATBELT</span>
      </div>

      <div class="chips">
        <span class="chip" id="chipEngine"><i></i><span>ENG</span></span>
        <span class="chip" id="chipLights"><i></i><span>LIGHT</span></span>
        <span class="chip" id="chipBelt"><i></i><span>BELT</span></span>
      </div>

    </header>

    <!-- ================= TENGAH ================= -->
    <section class="hud-mid">

      <div class="cell speed-cell">
        <div class="cell-label">VELOCITY</div>
        <div class="speed-num" id="vSpeed">0</div>
        <div class="speed-unit" id="vUnit">mph</div>
        <div class="speed-sub">ENGINE <b id="vRpmMid">0</b> RPM</div>
      </div>

      <div class="cell rpm-cell">
        <div class="cell-label">REV / RPM</div>
        <div class="rpm-value"><span id="vRpm">0</span><small>RPM</small></div>

        <div class="rpm-bars" id="rpmBars"></div>

        <div class="gear-box">
          <span class="lbl">GEAR</span>
          <span class="val" id="vGear">N</span>
        </div>
      </div>

    </section>

    <!-- ================= BAR BAWAH ================= -->
    <footer class="hud-bar hud-bar--bottom">

      <div class="odo">
        <small>ODO</small>
        <span id="vOdo">000000</span>
        <small id="vOdoUnit">mi</small>
      </div>

      <div class="meter fuel" id="mFuel">
        <div class="meter-head"><span>FUEL</span><b id="vFuel">--</b></div>
        <div class="track"><div class="fill" id="fFuel"></div></div>
      </div>

      <div class="meter health" id="mHealth">
        <div class="meter-head"><span>HEALTH</span><b id="vHealth">--</b></div>
        <div class="track"><div class="fill" id="fHealth"></div></div>
      </div>

    </footer>

    <!-- ================= SUMBER DATA (hidden) ================= -->
    <div class="data-source" hidden>
      <section>
        <dl>
          <dt>Engine</dt>      <dd id="engine">&nbsp;</dd>
          <dt>Speed</dt>       <dd id="speed">&nbsp;</dd>
          <dt>RPM</dt>         <dd id="rpm">&nbsp;</dd>
          <dt>Fuel</dt>        <dd id="fuel">&nbsp;</dd>
          <dt>Health</dt>      <dd id="health">&nbsp;</dd>
        </dl>
      </section>
      <section>
        <dl>
          <dt>Gear</dt>        <dd id="gear">&nbsp;</dd>
          <dt>Headlights</dt>  <dd id="headlights">&nbsp;</dd>
          <dt>Indicators</dt>  <dd id="indicators">&nbsp;</dd>
          <dt>Seatbelts</dt>   <dd id="seatbelts">&nbsp;</dd>
          <dt>Odometer</dt>    <dd id="odometer">&nbsp;</dd>
        </dl>
      </section>
    </div>

  </main>
</div>

<!-- ================= SOUND SEATBELT ================= -->
<audio id="seatbeltSound" src="seatbelt-warning.mp3" loop preload="auto"></audio>

<script src="script.js"></script>
<script src="hud.js"></script>

<!-- ================= Helper: generate RPM segments ================= -->
<script>
(function () {
  const bars = document.getElementById('rpmBars');
  if (!bars) return;

  bars.innerHTML = '';
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('span');
    s.className = 'seg' + (i >= 15 ? ' red' : '');
    bars.appendChild(s);
  }

  const segs = Array.from(bars.children);
  const rpmEl = document.getElementById('vRpm');
  const midEl = document.getElementById('vRpmMid');
  if (!rpmEl) return;

  function loop() {
    const val = parseInt(rpmEl.textContent.replace(/[^0-9]/g, ''), 10) || 0;
    const lit = Math.min(20, Math.round((val / 8000) * 20));
    segs.forEach((s, i) => s.classList.toggle('on', i < lit));
    if (midEl) midEl.textContent = val;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
