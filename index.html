<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc Reactor Cluster HUD</title>
<style>
  *,
  *::before,
  *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --txt:   #eaf4ff;
    --dim:   #8ba0b8;
    --cyan:  #19e6ff;
    --blue:  #4aa8ff;
    --amber: #ffc247;
    --red:   #ff3b5c;
    --green: #25d07d;

    --hud-width:  360px;
    --hud-right:  22px;
    --hud-bottom: 110px;
  }

  html, body {
    width: 100%; height: 100%;
    background: transparent !important;
    background-color: transparent !important;
    background-image: none !important;
    color: var(--txt);
    font-family: 'Segoe UI', 'SF Pro Display', system-ui, sans-serif;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  html::before, html::after, body::before, body::after { content: none !important; display: none !important; }

  /* ================= SCENE ================= */
  .scene {
    position: fixed;
    right: var(--hud-right);
    bottom: var(--hud-bottom);
    width: var(--hud-width);
    z-index: 9999;
    background: transparent !important;
    pointer-events: none;
    opacity: 0;
    transform: scale(.85) translateY(14px);
    transition: opacity .7s ease, transform .7s cubic-bezier(.22, 1, .36, 1);
  }
  .scene.hud-booted { opacity: 1; transform: scale(1) translateY(0); }

  /* ================= HUD (tanpa panel, hologram) ================= */
  .hud {
    --c1: #19e6ff;
    --c2: #8a7bff;
    --accent: #19e6ff;
    --accent-rgb: 25, 230, 255;

    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    background: transparent !important;
  }
  .hud.redline, .hud.hot {
    --c1: #ffc247;
    --c2: #ff3b5c;
    --accent: #ff3b5c;
    --accent-rgb: 255, 59, 92;
  }

  /* ================= TOP ROW ================= */
  .hud-bar--top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px;
  }

  .turn-signals { display: contents; }
  .arrow {
    width: 34px; height: 26px;
    background: rgba(70, 110, 160, .35) !important;
    clip-path: polygon(0 50%, 45% 0, 45% 28%, 100% 28%, 100% 72%, 45% 72%, 45% 100%);
    transition: .15s;
  }
  .arrow.right { transform: scaleX(-1); }
  .arrow.active {
    background: var(--green) !important;
    filter: drop-shadow(0 0 7px rgba(37, 208, 125, 1)) drop-shadow(0 0 14px rgba(37, 208, 125, .8));
  }
  /* DOM order: left, seatbelt, chips, right -> pakai order agar sein di ujung */
  #indLeft  { order: 1; }
  .chips    { order: 2; }
  #indRight { order: 3; }
  .seatbelt-warning { order: 4; }

  .chips { display: flex; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px;
    background: rgba(8, 26, 60, .55) !important;
    border: 1px solid rgba(var(--accent-rgb), .25);
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    color: var(--dim);
    font-size: 8.5px; font-weight: 800; letter-spacing: 1.2px;
    transition: .25s;
  }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: #3a4b63; transition: .25s; }
  .chip.active {
    color: #f4ffff;
    background: rgba(var(--accent-rgb), .22) !important;
    text-shadow: 0 0 6px rgba(var(--accent-rgb), 1);
  }
  .chip.active i { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .chip.warn { color: #ffe6ea; background: rgba(255, 59, 92, .25) !important; }
  .chip.warn i { background: var(--red); box-shadow: 0 0 6px var(--red); }

  /* ================= GAUGE ================= */
  .gauge {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    font-size: calc(var(--hud-width) * .01);   /* 1em = 1% lebar HUD */
  }
  .gauge > svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block; overflow: visible;
  }

  .g-disc-ring { fill: none; stroke: rgba(var(--accent-rgb), .35); stroke-width: 1; }
  .g-track     { fill: none; stroke: rgba(80, 130, 200, .2); stroke-width: 10; stroke-linecap: round; }
  .g-fill {
    fill: none; stroke: url(#spdGrad); stroke-width: 10; stroke-linecap: round;
    filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), .95)) drop-shadow(0 0 14px rgba(var(--accent-rgb), .5));
  }
  .g-tick     { stroke: rgba(150, 190, 235, .45); stroke-width: 1.2; }
  .g-tick.maj { stroke: rgba(220, 240, 255, .95); stroke-width: 2; }
  .g-label {
    fill: #9cbbdc; font-size: 10px; font-weight: 700;
    text-anchor: middle; dominant-baseline: middle;
  }
  .g-outer-a { fill: none; stroke: rgba(var(--accent-rgb), .55); stroke-width: 1.4; stroke-dasharray: 2 9; }
  .g-outer-b { fill: none; stroke: rgba(var(--accent-rgb), .8);  stroke-width: 2.5; stroke-dasharray: 40 220; stroke-linecap: round; }
  .g-inner-a { fill: none; stroke: rgba(var(--accent-rgb), .4);  stroke-width: 1.2; stroke-dasharray: 26 8 4 8; }
  .g-inner-b { fill: none; stroke: rgba(var(--accent-rgb), .25); stroke-width: 6; stroke-dasharray: 1.5 7; }

  .rpm-glow { filter: drop-shadow(0 0 4px rgba(var(--accent-rgb), .75)); }
  .rseg { stroke: rgba(70, 110, 170, .3); stroke-width: 8; transition: stroke .08s; }
  .rseg.on.c { stroke: var(--c1); }
  .rseg.on.a { stroke: #ffc247; }
  .rseg.on.r { stroke: #ff3b5c; }
  .rpm-lbl { fill: #6f9cc0; font-size: 8px; font-weight: 800; letter-spacing: 2px; text-anchor: middle; }

  .needle {
    stroke: #fff; stroke-width: 3; stroke-linecap: round;
    filter: drop-shadow(0 0 5px rgba(var(--accent-rgb), 1)) drop-shadow(0 0 10px rgba(var(--accent-rgb), .8));
  }

  /* radar sweep di tengah */
  .sweep {
    position: absolute;
    left: 25%; top: 25%; width: 50%; height: 50%;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg 290deg, rgba(var(--accent-rgb), .22) 360deg);
    animation: spin 3.2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .gauge-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding-bottom: 4%;
  }
  .speed-num {
    font-size: 21em; font-weight: 800;      /* ~ 21% lebar HUD */
    font-size: calc(var(--hud-width) * .215);
    line-height: .95; letter-spacing: -.05em;
    background: linear-gradient(180deg, #ffffff 0%, #b4efff 45%, var(--accent) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(var(--accent-rgb), .95)) drop-shadow(0 0 2px rgba(0, 0, 0, .95));
    font-variant-numeric: tabular-nums;
  }
  .speed-unit {
    margin-top: 2px;
    font-size: calc(var(--hud-width) * .03);
    letter-spacing: .35em;
    color: #c0d8f0; font-weight: 800;
    text-shadow: 0 0 6px rgba(0, 0, 0, .95);
  }
  .rpm-value {
    margin-top: calc(var(--hud-width) * .018);
    font-size: calc(var(--hud-width) * .05);
    font-weight: 800; color: #fff; line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 10px rgba(var(--accent-rgb), .95), 0 0 2px rgba(0, 0, 0, .95);
  }
  .rpm-value small {
    font-size: calc(var(--hud-width) * .022);
    color: #9cbbdc; letter-spacing: .25em; font-weight: 700; margin-left: 5px;
  }
  .speed-sub { display: none; }

  .seatbelt-warning {
    display: none;
    position: absolute; left: 50%; top: 24%;
    transform: translateX(-50%);
    align-items: center; gap: 4px;
    padding: 3px 11px;
    background: rgba(255, 59, 92, .3) !important;
    border: 1px solid rgba(255, 59, 92, .95);
    clip-path: polygon(7px 0, 100% 0, calc(100% - 7px) 100%, 0 100%);
    color: #ffe6ea;
    font-size: 9px; font-weight: 800; letter-spacing: 1.3px;
    text-shadow: 0 0 6px rgba(255, 59, 92, 1);
    animation: blink 1s steps(2, start) infinite;
    z-index: 3;
  }
  .seatbelt-warning.show { display: flex; }
  @keyframes blink { 50% { opacity: .3; } }

  /* gear hex */
  .gear-box {
    position: absolute;
    left: 50%; top: 77%;
    width: calc(var(--hud-width) * .2);
    height: calc(var(--hud-width) * .226);
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--c1), var(--c2)) !important;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), .9));
  }
  .gear-box::before {
    content: ""; position: absolute; inset: 2px;
    background: radial-gradient(circle at 50% 35%, rgba(var(--accent-rgb), .3), #061630 75%);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }
  .gear-box > * { position: relative; z-index: 1; }
  .gear-box .lbl {
    font-size: calc(var(--hud-width) * .02); letter-spacing: .25em;
    color: #9cbbdc; font-weight: 800; margin-top: 2px;
  }
  .gear-box .val {
    font-size: calc(var(--hud-width) * .105);
    font-weight: 800; color: #fff; line-height: 1;
    display: inline-block; min-width: 1ch; text-align: center;
    text-shadow: 0 0 14px rgba(var(--accent-rgb), 1), 0 0 3px rgba(0, 0, 0, .95);
  }
  .gear-box .val.pop { animation: gearPop .3s ease-out; }
  @keyframes gearPop {
    0% { transform: scale(.6); } 60% { transform: scale(1.22); } 100% { transform: scale(1); }
  }

  /* ================= BOTTOM STRIP ================= */
  .hud-bar--bottom {
    display: grid;
    grid-template-columns: auto 1fr 1fr;
    gap: 8px; align-items: center;
    padding: 0 4px;
  }
  .odo {
    display: flex; align-items: baseline; gap: 4px;
    padding: 5px 10px;
    background: rgba(6, 22, 52, .6) !important;
    border: 1px solid rgba(var(--accent-rgb), .25);
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 100%, 0 100%);
    font-variant-numeric: tabular-nums;
  }
  .odo small { font-size: 7px; letter-spacing: 1.6px; color: #a8c4e0; font-weight: 800; }
  .odo span {
    font-size: 13px; font-weight: 800; letter-spacing: .6px; color: #fff;
    text-shadow: 0 0 7px rgba(var(--accent-rgb), .9), 0 0 2px rgba(0, 0, 0, .95);
  }
  .odo #vOdoUnit { color: #a8c4e0; font-weight: 700; }

  .meter {
    display: flex; flex-direction: column; gap: 3px;
    padding: 4px 9px;
    background: rgba(6, 22, 52, .6) !important;
    border: 1px solid rgba(var(--accent-rgb), .2);
  }
  .meter-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 7px; letter-spacing: 1.6px; color: #a8c4e0; font-weight: 800;
  }
  .meter-head b {
    color: #fff; font-size: 10.5px; letter-spacing: 0;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 6px rgba(var(--accent-rgb), .8);
  }
  .track { height: 5px; background: rgba(8, 26, 60, .8) !important; overflow: hidden; }
  .fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--blue));
    box-shadow: 0 0 8px rgba(25, 230, 255, 1);
    transition: width .3s ease;
  }
  .meter.fuel .fill   { background: linear-gradient(90deg, var(--amber), #ffe08a); box-shadow: 0 0 8px rgba(255, 194, 71, .9); }
  .meter.health .fill { background: linear-gradient(90deg, var(--green), var(--cyan)); box-shadow: 0 0 8px rgba(37, 208, 125, .95); }
  .meter.low .fill {
    background: linear-gradient(90deg, var(--amber), var(--red)) !important;
    box-shadow: 0 0 8px rgba(255, 59, 92, 1) !important;
  }
  .meter.low .meter-head b { color: var(--red); text-shadow: 0 0 6px rgba(255, 59, 92, 1); }

  .data-source[hidden] { display: none !important; }

  /* ================= BOOT OVERLAY ================= */
  .boot-overlay {
    position: fixed;
    right: var(--hud-right);
    bottom: var(--hud-bottom);
    width: var(--hud-width);
    background: rgba(5, 18, 42, .93) !important;
    border: 1px solid rgba(25, 230, 255, .7);
    border-radius: 18px;
    padding: 18px 16px;
    z-index: 99999;
    display: flex; flex-direction: column; align-items: center; gap: 11px;
    opacity: 1; transform: scale(1);
    transition: opacity .5s ease, transform .5s ease;
    overflow: hidden;
    box-shadow: 0 0 28px -4px rgba(25, 230, 255, .8), inset 0 0 34px -10px rgba(25, 230, 255, .4);
    pointer-events: none;
  }
  .boot-overlay.hide { opacity: 0; transform: scale(.9) translateY(8px); pointer-events: none; }
  .boot-overlay::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(25, 230, 255, .08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(25, 230, 255, .08) 1px, transparent 1px);
    background-size: 16px 16px; pointer-events: none; opacity: .7;
  }
  .boot-scanline {
    position: absolute; left: 0; right: 0; height: 44px;
    background: linear-gradient(180deg, transparent, rgba(25, 230, 255, .35) 50%, transparent);
    animation: scanMove 1.6s linear infinite; pointer-events: none;
  }
  @keyframes scanMove { 0% { top: -44px; } 100% { top: 100%; } }
  .boot-core { width: 96px; height: 96px; position: relative; display: grid; place-items: center; }
  .boot-core svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .boot-ring-outer { fill: none; stroke: rgba(25, 230, 255, .8); stroke-width: 2; stroke-dasharray: 10 6; transform-origin: 50% 50%; animation: spinCW 4s linear infinite; }
  .boot-ring-mid   { fill: none; stroke: rgba(25, 230, 255, .5); stroke-width: 1.5; stroke-dasharray: 4 4; transform-origin: 50% 50%; animation: spinCCW 2.4s linear infinite; }
  .boot-hex { fill: none; stroke: rgba(25, 230, 255, 1); stroke-width: 2; filter: drop-shadow(0 0 6px rgba(25, 230, 255, .9)); }
  .boot-core-dot { fill: rgba(25, 230, 255, 1); filter: drop-shadow(0 0 10px rgba(25, 230, 255, 1)); animation: corePulse 1.2s ease-in-out infinite; }
  @keyframes spinCW  { to { transform: rotate(360deg); } }
  @keyframes spinCCW { to { transform: rotate(-360deg); } }
  @keyframes corePulse { 0%, 100% { opacity: 1; r: 6; } 50% { opacity: .4; r: 9; } }
  .boot-text {
    font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #9ae6ff;
    text-shadow: 0 0 8px rgba(25, 230, 255, 1), 0 0 2px rgba(0, 0, 0, .9);
    text-align: center; min-height: 14px; z-index: 2;
    animation: textFlicker .15s steps(2, start) infinite;
  }
  @keyframes textFlicker { 0%, 100% { opacity: 1; } 50% { opacity: .85; } }
  .boot-progress {
    width: 100%; height: 5px; background: rgba(10, 35, 75, .8);
    border: 1px solid rgba(25, 230, 255, .35); border-radius: 3px;
    overflow: hidden; position: relative; z-index: 2;
  }
  .boot-progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #19e6ff, #4aa8ff, #19e6ff);
    background-size: 200% 100%;
    box-shadow: 0 0 10px rgba(25, 230, 255, 1), inset 0 0 4px rgba(255, 255, 255, .5);
    animation: progressShine 1.5s linear infinite;
    transition: width .12s linear;
  }
  @keyframes progressShine { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .boot-stats { width: 100%; display: flex; justify-content: space-between; font-size: 7px; font-weight: 800; letter-spacing: 1.2px; color: #6f9cc0; z-index: 2; }
  .boot-overlay.glitch { animation: glitchShake .12s linear 3; }
  @keyframes glitchShake {
    0% { transform: translate(0, 0); } 25% { transform: translate(-2px, 1px); }
    50% { transform: translate(2px, -1px); } 75% { transform: translate(-1px, 2px); }
    100% { transform: translate(0, 0); }
  }

  /* ================= WELCOME BANNER ================= */
  .welcome-banner {
    position: fixed;
    right: var(--hud-right);
    bottom: calc(var(--hud-bottom) + 10px);
    width: var(--hud-width);
    background: rgba(5, 18, 42, .88);
    border: 1px solid rgba(25, 230, 255, .7);
    border-radius: 14px;
    padding: 13px 16px;
    z-index: 99998;
    display: flex; flex-direction: column; gap: 4px;
    opacity: 0; transform: translateY(12px);
    transition: opacity .5s ease, transform .5s cubic-bezier(.22, 1, .36, 1);
    box-shadow: 0 0 26px -4px rgba(25, 230, 255, .8), inset 0 0 20px -8px rgba(25, 230, 255, .4);
    pointer-events: none; overflow: hidden;
  }
  .welcome-banner.show { opacity: 1; transform: translateY(0); }
  .welcome-banner::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(25, 230, 255, .06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(25, 230, 255, .06) 1px, transparent 1px);
    background-size: 12px 12px; pointer-events: none; opacity: .6;
  }
  .welcome-line-1 { font-size: 9px; letter-spacing: 2px; color: #6f9cc0; font-weight: 800; z-index: 1; }
  .welcome-line-2 {
    font-size: 18px; letter-spacing: .5px; font-weight: 800;
    background: linear-gradient(90deg, #ffffff, #7fdcff, #19e6ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 8px rgba(25, 230, 255, .9)) drop-shadow(0 0 2px rgba(0, 0, 0, .95));
    z-index: 1;
  }
  .welcome-line-3 { font-size: 8.5px; letter-spacing: 1.6px; color: #19e6ff; font-weight: 800; text-shadow: 0 0 6px rgba(25, 230, 255, 1); z-index: 1; }
  .welcome-banner::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #19e6ff, transparent);
    animation: welcomePulse 1.5s ease-in-out infinite;
  }
  @keyframes welcomePulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 900px) { :root { --hud-width: 320px; --hud-right: 14px; --hud-bottom: 100px; } }
  @media (max-width: 640px) {
    :root { --hud-width: 270px; --hud-right: 8px; --hud-bottom: 90px; }
    .chip span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<!-- ================= BOOT OVERLAY ================= -->
<div class="boot-overlay" id="bootOverlay">
  <div class="boot-scanline"></div>
  <div class="boot-core">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="boot-ring-outer" cx="50" cy="50" r="42"/>
      <circle class="boot-ring-mid" cx="50" cy="50" r="33"/>
      <polygon class="boot-hex" points="50,20 76,35 76,65 50,80 24,65 24,35"/>
      <line x1="50" y1="30" x2="50" y2="70" stroke="rgba(25,230,255,.6)" stroke-width="1"/>
      <line x1="30" y1="50" x2="70" y2="50" stroke="rgba(25,230,255,.6)" stroke-width="1"/>
      <circle class="boot-core-dot" cx="50" cy="50" r="6"/>
    </svg>
  </div>
  <div class="boot-text" id="bootText">INITIALIZING AI CORE...</div>
  <div class="boot-progress"><div class="boot-progress-fill" id="bootProgressFill"></div></div>
  <div class="boot-stats">
    <span id="bootCpu">CPU: --%</span>
    <span id="bootMem">MEM: --%</span>
    <span id="bootNet">NET: OK</span>
  </div>
</div>

<!-- ================= WELCOME BANNER ================= -->
<div class="welcome-banner" id="welcomeBanner">
  <div class="welcome-line-1">WELCOME MESSAGE</div>
  <div class="welcome-line-2">SELAMAT DATANG, BOS</div>
  <div class="welcome-line-3">SHAQUILLE CARVINSON</div>
</div>

<!-- ================= HUD UTAMA ================= -->
<div class="scene" id="scene">
  <main class="hud" id="hud">

    <header class="hud-bar--top">
      <div class="turn-signals">
        <span class="arrow left"  id="indLeft"></span>
        <span class="arrow right" id="indRight"></span>
      </div>

      <div class="chips">
        <span class="chip" id="chipEngine"><i></i><span>ENG</span></span>
        <span class="chip" id="chipLights"><i></i><span>LIGHT</span></span>
        <span class="chip" id="chipBelt"><i></i><span>BELT</span></span>
      </div>
    </header>

    <section class="gauge" id="gauge">
      <svg viewBox="0 0 400 400" aria-hidden="true">
        <defs>
          <linearGradient id="spdGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" style="stop-color:var(--c1)"/>
            <stop offset="1" style="stop-color:var(--c2)"/>
          </linearGradient>
          <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0"   stop-color="#0b2a5c" stop-opacity=".85"/>
            <stop offset=".75" stop-color="#061a3c" stop-opacity=".8"/>
            <stop offset="1"   stop-color="#041229" stop-opacity=".55"/>
          </radialGradient>
          <radialGradient id="backGrad" cx="50%" cy="50%" r="50%">
            <stop offset=".6" stop-color="#030c1e" stop-opacity=".55"/>
            <stop offset="1"  stop-color="#030c1e" stop-opacity="0"/>

<!-- ================= ARC REACTOR GAUGE ================= -->
<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const RPM_MAX  = 8000;
  const RPM_SEGS = 36;

  const R   = 160;
  const C   = 2 * Math.PI * R;
  const ARC = C * 0.75;                       // 270 derajat

  const track  = document.getElementById('gTrack');
  const fill   = document.getElementById('gFill');
  const needle = document.getElementById('gNeedle');
  const ticks  = document.getElementById('gTicks');
  const rpmG   = document.getElementById('rpmSegs');
  const outerG = document.getElementById('gOuter');
  const innerG = document.getElementById('gInner');

  track.style.strokeDasharray = ARC + ' ' + C;
  fill.style.strokeDasharray  = '0 ' + C;

  /* ---------- RPM segments ---------- */
  const segs = [];
  for (let i = 0; i < RPM_SEGS; i++) {
    const ang = (135 + ((i + 0.5) / RPM_SEGS) * 270) * Math.PI / 180;
    const ln = document.createElementNS(NS, 'line');
    ln.setAttribute('x1', 200 + Math.cos(ang) * 120);
    ln.setAttribute('y1', 200 + Math.sin(ang) * 120);
    ln.setAttribute('x2', 200 + Math.cos(ang) * 138);
    ln.setAttribute('y2', 200 + Math.sin(ang) * 138);
    const f = i / RPM_SEGS;
    ln.setAttribute('class', 'rseg ' + (f < 0.62 ? 'c' : f < 0.82 ? 'a' : 'r'));
    ln.style.strokeWidth = 6.5;
    rpmG.appendChild(ln);
    segs.push(ln);
  }

  /* ---------- speed ticks ---------- */
  let curMax = 0;
  function buildTicks(max) {
    curMax = max;
    ticks.innerHTML = '';
    const step = max / 8;
    for (let i = 0; i <= 40; i++) {
      const ang = (135 + (i / 40) * 270) * Math.PI / 180;
      const major = i % 5 === 0;
      const r1 = major ? 168 : 171, r2 = 177;
      const ln = document.createElementNS(NS, 'line');
      ln.setAttribute('x1', 200 + Math.cos(ang) * r1);
      ln.setAttribute('y1', 200 + Math.sin(ang) * r1);
      ln.setAttribute('x2', 200 + Math.cos(ang) * r2);
      ln.setAttribute('y2', 200 + Math.sin(ang) * r2);
      ln.setAttribute('class', 'g-tick' + (major ? ' maj' : ''));
      ticks.appendChild(ln);

      if (major) {
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('x', 200 + Math.cos(ang) * 188);
        t.setAttribute('y', 200 + Math.sin(ang) * 188);
        t.setAttribute('class', 'g-label');
        t.textContent = Math.round(step * (i / 5));
        ticks.appendChild(t);
      }
    }
  }
  buildTicks(160);

  /* ---------- loop ---------- */
  const speedEl = document.getElementById('vSpeed');
  const unitEl  = document.getElementById('vUnit');
  const rpmEl   = document.getElementById('vRpm');
  const midEl   = document.getElementById('vRpmMid');
  const hudEl   = document.getElementById('hud');

  let smooth = 0, smoothRpm = 0, spin = 0;

  function loop() {
    const speed = parseFloat((speedEl.textContent || '').replace(/[^0-9.]/g, '')) || 0;
    const rpm   = parseInt((rpmEl.textContent || '').replace(/[^0-9]/g, ''), 10) || 0;
    const unit  = (unitEl.textContent || '').trim().toLowerCase();
    const max   = unit.indexOf('k') === 0 ? 240 : 160;

    if (max !== curMax) buildTicks(max);

    smooth    += (Math.min(1, speed / max) - smooth) * 0.16;
    smoothRpm += (Math.min(1, rpm / RPM_MAX) - smoothRpm) * 0.25;

    /* speed arc + needle */
    fill.style.strokeDasharray = (ARC * smooth) + ' ' + C;
    needle.setAttribute('transform', 'rotate(' + (135 + smooth * 270) + ' 200 200)');

    /* rpm segments */
    const lit = Math.round(smoothRpm * RPM_SEGS);
    for (let i = 0; i < RPM_SEGS; i++) segs[i].classList.toggle('on', i < lit);

    /* redline */
    hudEl.classList.toggle('hot', smoothRpm > 0.86);

    /* ring dekoratif: makin cepat makin kencang berputar */
    spin += 0.12 + speed * 0.018;
    outerG.setAttribute('transform', 'rotate(' + spin + ' 200 200)');
    innerG.setAttribute('transform', 'rotate(' + (-spin * 1.6) + ' 200 200)');

    if (midEl) midEl.textContent = rpm;

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>


<!-- ================= BOOT SEQUENCE + WELCOME ================= -->
<script>
(function () {
  'use strict';

  /* ====== CONFIG ====== */
  const AUTO_BOOT       = true;   // false = matikan boot otomatis
  const BOOT_DURATION   = 5000;   // durasi boot (ms)
  const AUTO_WELCOME    = true;   // putar welcome setelah boot

  const WELCOME_TEXT    = 'Selamat datang Bos Shaquille Carvinson';
  const USE_MP3         = true;   // true = welcome.mp3, false = TTS

  /* ====== ELEMEN ====== */
  const overlay    = document.getElementById('bootOverlay');
  const textEl     = document.getElementById('bootText');
  const fillEl     = document.getElementById('bootProgressFill');
  const cpuEl      = document.getElementById('bootCpu');
  const memEl      = document.getElementById('bootMem');
  const netEl      = document.getElementById('bootNet');
  const sceneEl    = document.getElementById('scene');
  const bannerEl   = document.getElementById('welcomeBanner');
  const mp3Welcome = document.getElementById('welcomeSound');

  if (!overlay) return;

  /* ====== AUDIO ENGINE ====== */
  let audioCtx = null;
  function getAudio() {
    if (audioCtx) return audioCtx;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }

  function beep(freq, dur = 0.08, vol = 0.08, type = 'square', delay = 0) {
    const ctx = getAudio();
    if (!ctx) return;
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = ctx.currentTime + delay;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function sweep(f1, f2, dur = 0.4, vol = 0.05, type = 'sawtooth', delay = 0) {
    const ctx = getAudio();
    if (!ctx) return;
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    const t0 = ctx.currentTime + delay;
    osc.frequency.setValueAtTime(f1, t0);
    osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function chord(freqs, dur = 0.6, vol = 0.06) {
    freqs.forEach((f, i) => beep(f, dur, vol, 'sine', i * 0.02));
  }

  function drone(dur = 5, vol = 0.025) {
    const ctx = getAudio();
    if (!ctx) return;
    const osc  = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type  = 'sawtooth';
    osc2.type = 'sine';
    osc.frequency.value  = 55;
    osc2.frequency.value = 82.4;
    const t0 = ctx.currentTime;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.5);
    gain.gain.setValueAtTime(vol, t0 + dur - 0.6);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    osc2.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);  osc.stop(t0 + dur + 0.1);
    osc2.start(t0); osc2.stop(t0 + dur + 0.1);
  }

  function playBootAudio() {
    beep(220, 0.10, 0.09, 'square', 0.00);
    beep(440, 0.10, 0.09, 'square', 0.18);
    beep(660, 0.10, 0.09, 'square', 0.36);

    drone(BOOT_DURATION / 1000, 0.022);

    for (let i = 0; i < 4; i++) sweep(300, 900, 0.35, 0.035, 'sawtooth', 0.6 + i * 0.9);
    for (let i = 0; i < 18; i++) beep(1200 + (i % 3) * 200, 0.03, 0.025, 'square', 1.0 + i * 0.18);

    const tEnd = BOOT_DURATION / 1000 - 0.5;
    chord([523.25, 659.25, 783.99], 0.7, 0.07);
    beep(1046.50, 0.15, 0.08, 'square', tEnd + 0.35);
    sweep(200, 1500, 0.4, 0.06, 'square', tEnd + 0.5);
  }

  /* ====== WELCOME AUDIO ====== */
  function playWelcomeChime() {
    beep(587.33, 0.30, 0.10, 'sine', 0.00);
    beep(880.00, 0.50, 0.10, 'sine', 0.18);
    beep(1174.66, 0.20, 0.06, 'sine', 0.40);
  }

  function speakWelcome() {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(WELCOME_TEXT);
    u.lang   = 'id-ID';
    u.rate   = 0.95;
    u.pitch  = 1.05;
    u.volume = 1.0;
    const voices = speechSynthesis.getVoices();
    const idVoice = voices.find(v => /id[-_]ID/i.test(v.lang))
                 || voices.find(v => /indonesia/i.test(v.name));
    if (idVoice) u.voice = idVoice;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  let welcomeDone = false;

  function playWelcome(force) {
    if (welcomeDone && !force) return;
    welcomeDone = true;

    playWelcomeChime();

    if (bannerEl) {
      bannerEl.classList.add('show');
      setTimeout(() => bannerEl.classList.remove('show'), 4500);
    }

    setTimeout(() => {
      if (USE_MP3 && mp3Welcome) {
        mp3Welcome.currentTime = 0;
        mp3Welcome.volume = 1.0;
        mp3Welcome.play().catch(() => speakWelcome());
      } else {
        speakWelcome();
      }
    }, 550);
  }

  window.playWelcome = function () { playWelcome(true); };

  /* ====== BOOT STAGES ====== */
  const BOOT_STAGES = [
    { at:  0, text: 'INITIALIZING AI CORE...' },
    { at: 12, text: 'LOADING MODULES...' },
    { at: 30, text: 'CALIBRATING SENSORS...' },
    { at: 50, text: 'ESTABLISHING NEURAL LINK...' },
    { at: 68, text: 'SYNCING VEHICLE DATA...' },
    { at: 85, text: 'RUNNING DIAGNOSTICS...' },
    { at: 96, text: 'SYSTEM READY' }
  ];

  let bootTimer = null;
  let startTime = 0;
  let running   = false;

  function startBoot() {
    if (running) return;
    running = true;

    overlay.classList.remove('hide');
    sceneEl.classList.remove('hud-booted');

    fillEl.style.width = '0%';
    textEl.textContent = 'INITIALIZING AI CORE...';
    cpuEl.textContent  = 'CPU: 0%';
    memEl.textContent  = 'MEM: 0%';
    netEl.textContent  = 'NET: OK';

    playBootAudio();
    startTime = performance.now();

    cancelAnimationFrame(bootTimer);
    function tick(now) {
      const elapsed = now - startTime;
      const pct = Math.min(100, (elapsed / BOOT_DURATION) * 100);

      fillEl.style.width = pct.toFixed(2) + '%';

      let stage = BOOT_STAGES[0];
      for (const s of BOOT_STAGES) if (pct >= s.at) stage = s;
      if (textEl.textContent !== stage.text) {
        textEl.textContent = stage.text;
        overlay.classList.add('glitch');
        setTimeout(() => overlay.classList.remove('glitch'), 360);
      }

      cpuEl.textContent = 'CPU: ' + Math.min(100, Math.floor(pct + Math.random() * 8)) + '%';
      memEl.textContent = 'MEM: ' + Math.min(100, Math.floor(pct * 0.85 + Math.random() * 10)) + '%';

      if (pct >= 100) { finishBoot(); return; }
      bootTimer = requestAnimationFrame(tick);
    }
    bootTimer = requestAnimationFrame(tick);
  }

  function finishBoot() {
    fillEl.style.width = '100%';
    textEl.textContent = 'SYSTEM READY';
    cpuEl.textContent  = 'CPU: 100%';
    memEl.textContent  = 'MEM: 100%';
    netEl.textContent  = 'NET: CONNECTED';

    setTimeout(() => {
      overlay.classList.add('hide');
      setTimeout(() => {
        sceneEl.classList.add('hud-booted');
        running = false;
        if (AUTO_WELCOME) setTimeout(() => playWelcome(), 400);
      }, 200);
    }, 700);
  }

  if (AUTO_BOOT) {
    if (document.readyState === 'complete') {
      setTimeout(startBoot, 300);
    } else {
      window.addEventListener('load', () => setTimeout(startBoot, 300));
    }
  }

  /* ====== TRIGGER MANUAL ======
     window.playBootSequence()  -> boot ulang
     window.playWelcome()       -> welcome saja
     SendNUIMessage({ action = 'boot' | 'welcome' })
  */
  window.playBootSequence = function () {
    running = false;
    welcomeDone = false;
    cancelAnimationFrame(bootTimer);
    startBoot();
  };

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d) return;
    if (d.action === 'boot' || d.type === 'boot') window.playBootSequence();
    if (d.action === 'welcome' || d.type === 'welcome') playWelcome(true);
  });

  /* Unlock audio */
  function unlockOnce() {
    const ctx = getAudio();
    if (ctx && ctx.state === 'suspended') ctx.resume();

    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
    }

    if (mp3Welcome) {
      mp3Welcome.volume = 0;
      mp3Welcome.play().then(() => {
        mp3Welcome.pause();
        mp3Welcome.currentTime = 0;
        mp3Welcome.volume = 1.0;
      }).catch(() => {});
    }
  }
  window.addEventListener('pointerdown', unlockOnce, { once: true });
  window.addEventListener('keydown',     unlockOnce, { once: true });

  if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = () => {};
    speechSynthesis.getVoices();
  }
})();
</script>
