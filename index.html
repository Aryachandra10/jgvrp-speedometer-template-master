<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race Cluster HUD</title>
<style>
  *,
  *::before,
  *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --txt:   #eaf4ff;
    --dim:   #8ba0b8;
    --cyan:  #19e6ff;
    --blue:  #4aa8ff;
    --amber: #ffc247;
    --red:   #ff3b5c;
    --green: #25d07d;

    --hud-width:  360px;
    --hud-right:  22px;
    --hud-bottom: 110px;
  }

  html, body {
    width: 100%; height: 100%;
    background: transparent !important;
    background-color: transparent !important;
    background-image: none !important;
    color: var(--txt);
    font-family: 'Segoe UI', 'SF Pro Display', system-ui, sans-serif;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  html::before, html::after, body::before, body::after { content: none !important; display: none !important; }

  /* ================= SCENE ================= */
  .scene {
    position: fixed;
    right: var(--hud-right);
    bottom: var(--hud-bottom);
    width: var(--hud-width);
    z-index: 9999;
    background: transparent !important;
    pointer-events: none;
    opacity: 0;
    transform: scale(.85) translateY(14px);
    transition: opacity .7s ease, transform .7s cubic-bezier(.22, 1, .36, 1);
  }
  .scene.hud-booted { opacity: 1; transform: scale(1) translateY(0); }

  /* ================= HUD ================= */
  .hud {
    --c1: #19e6ff;
    --c2: #4aa8ff;
    --accent: #19e6ff;
    --accent-rgb: 25, 230, 255;

    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 5px;
    position: relative;
    background: transparent !important;
  }
  .hud.redline, .hud.hot {
    --c1: #ffc247;
    --c2: #ff3b5c;
    --accent: #ff3b5c;
    --accent-rgb: 255, 59, 92;
  }

  /* ================= TOP: SHIFT LIGHTS + SEIN ================= */
  .hud-bar--top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 0 2px;
  }
  .turn-signals { display: contents; }
  #indLeft  { order: 1; }
  .shift-lights { order: 2; }
  #indRight { order: 3; }

  .arrow {
    flex: none;
    width: 30px; height: 22px;
    background: rgba(70, 110, 160, .35) !important;
    clip-path: polygon(0 50%, 45% 0, 45% 28%, 100% 28%, 100% 72%, 45% 72%, 45% 100%);
    transition: .15s;
  }
  .arrow.right { transform: scaleX(-1); }
  .arrow.active {
    background: var(--green) !important;
    filter: drop-shadow(0 0 7px rgba(37, 208, 125, 1)) drop-shadow(0 0 14px rgba(37, 208, 125, .8));
  }

  /* lampu shift ala F1 */
  .shift-lights {
    flex: 1;
    display: flex; justify-content: center; gap: 4px;
    transform: skewX(-14deg);
  }
  .sl {
    flex: 1; max-width: 17px; height: 11px;
    background: rgba(40, 60, 90, .55);
    border: 1px solid rgba(160, 200, 255, .25);
    border-radius: 2px;
    transition: background .06s, box-shadow .06s;
  }
  .sl.g.on { background: #25d07d; box-shadow: 0 0 9px #25d07d; border-color: #b8ffd8; }
  .sl.r.on { background: #ff3b5c; box-shadow: 0 0 9px #ff3b5c; border-color: #ffc0cb; }
  .sl.b.on { background: #3d8bff; box-shadow: 0 0 10px #3d8bff; border-color: #cfe0ff; }
  .hud.flash .sl { background: #3d8bff; box-shadow: 0 0 12px #3d8bff; }

  /* chip */
  .hud-bar--chips { display: flex; justify-content: center; }
  .chips { display: flex; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 9px;
    background: rgba(8, 20, 44, .6) !important;
    border: 1px solid rgba(var(--accent-rgb), .25);
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    color: var(--dim);
    font-size: 8.5px; font-weight: 800; letter-spacing: 1.2px;
    transition: .25s;
  }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: #3a4b63; transition: .25s; }
  .chip.active {
    color: #f4ffff;
    background: rgba(var(--accent-rgb), .22) !important;
    text-shadow: 0 0 6px rgba(var(--accent-rgb), 1);
  }
  .chip.active i { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .chip.warn { color: #ffe6ea; background: rgba(255, 59, 92, .25) !important; }
  .chip.warn i { background: var(--red); box-shadow: 0 0 6px var(--red); }

  /* ================= GAUGE ================= */
  .gauge {
    position: relative;
    width: 100%;
    aspect-ratio: 400 / 250;
  }
  .gauge > svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block; overflow: visible;
  }

  .g-base   { fill: none; stroke: rgba(var(--accent-rgb), .35); stroke-width: 1.2; }
  .g-track  { fill: none; stroke: rgba(80, 130, 200, .22); stroke-width: 6; }
  .g-fill {
    fill: none; stroke: url(#spdGrad); stroke-width: 6;
    filter: drop-shadow(0 0 5px rgba(var(--accent-rgb), .95)) drop-shadow(0 0 12px rgba(var(--accent-rgb), .5));
  }
  .g-dot { fill: #fff; filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 1)); }
  .g-tick     { stroke: rgba(150, 190, 235, .45); stroke-width: 1.2; }
  .g-tick.maj { stroke: rgba(220, 240, 255, .95); stroke-width: 2; }
  .g-label {
    fill: #9cbbdc; font-size: 9px; font-weight: 700; font-style: italic;
    text-anchor: middle; dominant-baseline: middle;
  }
  .r-label {
    fill: #b8d4ee; font-size: 11px; font-weight: 800; font-style: italic;
    text-anchor: middle; dominant-baseline: middle;
  }
  .r-label.red { fill: #ff6b84; }

  .rpm-glow { filter: drop-shadow(0 0 4px rgba(var(--accent-rgb), .7)); }
  .rseg { stroke: rgba(70, 110, 170, .3); stroke-width: 7; transition: stroke .07s; }
  .rseg.on.c { stroke: var(--c1); }
  .rseg.on.a { stroke: #ffc247; }
  .rseg.on.r { stroke: #ff3b5c; }
  .rpm-lbl { fill: #6f9cc0; font-size: 7px; font-weight: 800; letter-spacing: 2px; text-anchor: middle; }

  .gauge-center {
    position: absolute;
    left: 17%; right: 17%; top: 40%;
    display: flex; align-items: center; justify-content: center;
    gap: calc(var(--hud-width) * .03);
  }
  .speed-col { display: flex; flex-direction: column; align-items: center; }
  .speed-num {
    font-size: calc(var(--hud-width) * .2);
    font-weight: 900; font-style: italic;
    line-height: .95; letter-spacing: -.05em;
    min-width: 2.1ch; text-align: center;
    background: linear-gradient(180deg, #ffffff 0%, #c4f2ff 45%, var(--accent) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(var(--accent-rgb), .95)) drop-shadow(0 0 2px rgba(0, 0, 0, .95));
    font-variant-numeric: tabular-nums;
    padding-right: .08em;
  }
  .speed-unit {
    margin-top: 1px;
    font-size: calc(var(--hud-width) * .028);
    letter-spacing: .35em; padding-left: .35em;
    color: #c0d8f0; font-weight: 800;
    text-shadow: 0 0 6px rgba(0, 0, 0, .95);
  }

  /* gear miring */
  .gear-box {
    position: relative;
    width: calc(var(--hud-width) * .15);
    height: calc(var(--hud-width) * .19);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--c1), var(--c2)) !important;
    clip-path: polygon(22% 0, 100% 0, 78% 100%, 0 100%);
    filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), .9));
  }
  .gear-box::before {
    content: ""; position: absolute; inset: 2px;
    background: radial-gradient(circle at 50% 35%, rgba(var(--accent-rgb), .3), #061630 78%);
    clip-path: polygon(22% 0, 100% 0, 78% 100%, 0 100%);
  }
  .gear-box > * { position: relative; z-index: 1; }
  .gear-box .lbl {
    font-size: calc(var(--hud-width) * .02); letter-spacing: .25em;
    color: #9cbbdc; font-weight: 800; margin-top: 1px; padding-left: .25em;
  }
  .gear-box .val {
    font-size: calc(var(--hud-width) * .098);
    font-weight: 900; font-style: italic; color: #fff; line-height: 1;
    display: inline-block; min-width: 1ch; text-align: center;
    text-shadow: 0 0 14px rgba(var(--accent-rgb), 1), 0 0 3px rgba(0, 0, 0, .95);
  }

  .rpm-value {
    position: absolute; left: 50%; bottom: 1%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: calc(var(--hud-width) * .05);
    font-weight: 800; font-style: italic; color: #fff; line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 10px rgba(var(--accent-rgb), .95), 0 0 2px rgba(0, 0, 0, .95);
  }
  .rpm-value small {
    font-size: calc(var(--hud-width) * .022);
    color: #9cbbdc; letter-spacing: .25em; font-weight: 700; margin-left: 5px;
  }

  .seatbelt-warning {
    display: none;
    position: absolute; left: 50%; top: 27%;
    transform: translateX(-50%);
    align-items: center; gap: 4px;
    padding: 3px 11px;
    background: rgba(255, 59, 92, .35) !important;
    border: 1px solid rgba(255, 59, 92, .95);
    clip-path: polygon(7px 0, 100% 0, calc(100% - 7px) 100%, 0 100%);
    color: #ffe6ea;
    font-size: 9px; font-weight: 800; letter-spacing: 1.3px;
    text-shadow: 0 0 6px rgba(255, 59, 92, 1);
    z-index: 3;
  }
  .seatbelt-warning.show { display: flex; }

  /* ================= BOTTOM STRIP ================= */
  .hud-bar--bottom {
    display: grid;
    grid-template-columns: auto 1fr 1fr auto;
    gap: 6px; align-items: stretch;
    padding: 0 2px;
  }
  .odo, .top-box {
    display: flex; align-items: baseline; gap: 4px;
    padding: 5px 9px;
    background: rgba(6, 18, 42, .62) !important;
    border: 1px solid rgba(var(--accent-rgb), .25);
    font-variant-numeric: tabular-nums;
  }
  .odo { clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 100%, 0 100%); }
  .top-box { clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%); flex-direction: column; align-items: center; gap: 1px; padding: 4px 10px 4px 14px; }
  .odo small, .top-box small { font-size: 7px; letter-spacing: 1.6px; color: #a8c4e0; font-weight: 800; }
  .odo span {
    font-size: 12px; font-weight: 800; letter-spacing: .6px; color: #fff;
    text-shadow: 0 0 7px rgba(var(--accent-rgb), .9), 0 0 2px rgba(0, 0, 0, .95);
  }
  .odo #vOdoUnit { color: #a8c4e0; font-weight: 700; }
  .top-box b {
    font-size: 13px; font-style: italic; color: var(--amber);
    text-shadow: 0 0 7px rgba(255, 194, 71, .9);
  }

  .meter {
    display: flex; flex-direction: column; gap: 3px;
    padding: 4px 8px;
    background: rgba(6, 18, 42, .62) !important;
    border: 1px solid rgba(var(--accent-rgb), .2);
  }
  .meter-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 7px; letter-spacing: 1.6px; color: #a8c4e0; font-weight: 800;
  }
  .meter-head b {
    color: #fff; font-size: 10.5px; letter-spacing: 0;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 6px rgba(var(--accent-rgb), .8);
  }
  .track { height: 5px; background: rgba(8, 26, 60, .8) !important; overflow: hidden; transform: skewX(-20deg); }
  .fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--blue));
    box-shadow: 0 0 8px rgba(25, 230, 255, 1);
    transition: width .3s ease;
  }
  .meter.fuel .fill   { background: linear-gradient(90deg, var(--amber), #ffe08a); box-shadow: 0 0 8px rgba(255, 194, 71, .9); }
  .meter.health .fill { background: linear-gradient(90deg, var(--green), var(--cyan)); box-shadow: 0 0 8px rgba(37, 208, 125, .95); }
  .meter.low .fill {
    background: linear-gradient(90deg, var(--amber), var(--red)) !important;
    box-shadow: 0 0 8px rgba(255, 59, 92, 1) !important;
  }
  .meter.low .meter-head b { color: var(--red); text-shadow: 0 0 6px rgba(255, 59, 92, 1); }

  /* ================= MUSIC PLAYER ================= */
  .music {
    display: flex; align-items: center; gap: 8px;
    margin: 0 2px;
    padding: 4px 12px;
    background: rgba(6, 18, 42, .62) !important;
    border: 1px solid rgba(var(--accent-rgb), .2);
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
  .music[hidden] { display: none !important; }
  .m-ico {
    width: 10px; text-align: center; font-size: 9px;
    color: var(--accent); text-shadow: 0 0 6px rgba(var(--accent-rgb), .9);
  }
  .m-info { display: flex; flex-direction: column; min-width: 0; flex: 0 1 38%; line-height: 1.15; }
  .m-info b {
    font-size: 10px; font-weight: 800; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 0 6px rgba(var(--accent-rgb), .7);
  }
  .m-info small {
    font-size: 7.5px; letter-spacing: 1.2px; color: #a8c4e0; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .m-prog { flex: 1; height: 4px; background: rgba(8, 26, 60, .8); overflow: hidden; transform: skewX(-20deg); }
  .m-prog > div { height: 100%; width: 0%; background: linear-gradient(90deg, var(--c1), var(--c2)); }
  .m-meta {
    display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15;
    font-variant-numeric: tabular-nums; min-width: 40px;
  }
  .m-meta span { font-size: 9px; font-weight: 800; color: #c0d8f0; }
  .m-meta small { font-size: 7px; letter-spacing: 1.2px; color: #6f9cc0; font-weight: 800; }

  /* garis finish */
  .checker {
    height: 6px; margin: 1px 2px 0;
    background: repeating-conic-gradient(rgba(255,255,255,.9) 0% 25%, rgba(10,16,30,.9) 0% 50%) 0 0 / 12px 12px;
    opacity: .55;
    transform: skewX(-20deg);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
  }

  .data-source[hidden] { display: none !important; }

  /* ================= BOOT OVERLAY (START LIGHTS) ================= */
  .boot-overlay {
    position: fixed;
    right: var(--hud-right);
    bottom: var(--hud-bottom);
    width: var(--hud-width);
    background: rgba(5, 12, 28, .93) !important;
    border: 1px solid rgba(25, 230, 255, .7);
    border-radius: 14px;
    padding: 18px 16px;
    z-index: 99999;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    opacity: 1; transform: scale(1);
    transition: opacity .5s ease, transform .5s ease;
    overflow: hidden;
    box-shadow: 0 0 28px -4px rgba(25, 230, 255, .8), inset 0 0 34px -10px rgba(25, 230, 255, .4);
    pointer-events: none;
  }
  .boot-overlay.hide { opacity: 0; transform: scale(.9) translateY(8px); pointer-events: none; }
  .boot-overlay::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-conic-gradient(rgba(255,255,255,.05) 0% 25%, transparent 0% 50%) 0 0 / 14px 14px;
    pointer-events: none;
  }

  .start-lights { display: flex; gap: 12px; z-index: 2; padding: 8px 14px; background: #02060f; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); }
  .start-light {
    width: 24px; height: 24px; border-radius: 50%;
    background: #2a0a10; border: 2px solid #12060a;
    transition: background .1s, box-shadow .1s;
  }
  .start-light.on { background: #ff2a45; box-shadow: 0 0 14px #ff2a45, 0 0 28px rgba(255,42,69,.7); }
  .boot-overlay.go .start-light { background: #25d07d; box-shadow: 0 0 14px #25d07d, 0 0 28px rgba(37,208,125,.7); border-color: #0a2a1a; }

  .boot-text {
    font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #9ae6ff;
    text-shadow: 0 0 8px rgba(25, 230, 255, 1), 0 0 2px rgba(0, 0, 0, .9);
    text-align: center; min-height: 14px; z-index: 2;
  }
  .boot-progress {
    width: 100%; height: 5px; background: rgba(10, 35, 75, .8);
    border: 1px solid rgba(25, 230, 255, .35); border-radius: 3px;
    overflow: hidden; position: relative; z-index: 2;
  }
  .boot-progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #19e6ff, #4aa8ff);
    box-shadow: 0 0 10px rgba(25, 230, 255, 1);
    transition: width .12s linear;
  }
  .boot-stats { width: 100%; display: flex; justify-content: space-between; font-size: 7px; font-weight: 800; letter-spacing: 1.2px; color: #6f9cc0; z-index: 2; }

  /* ================= WELCOME BANNER ================= */
  .welcome-banner {
    position: fixed;
    right: var(--hud-right);
    bottom: calc(var(--hud-bottom) + 10px);
    width: var(--hud-width);
    background: rgba(5, 12, 28, .88);
    border: 1px solid rgba(25, 230, 255, .7);
    border-radius: 14px;
    padding: 13px 16px;
    z-index: 99998;
    display: flex; flex-direction: column; gap: 4px;
    opacity: 0; transform: translateY(12px);
    transition: opacity .5s ease, transform .5s cubic-bezier(.22, 1, .36, 1);
    box-shadow: 0 0 26px -4px rgba(25, 230, 255, .8), inset 0 0 20px -8px rgba(25, 230, 255, .4);
    pointer-events: none; overflow: hidden;
  }
  .welcome-banner.show { opacity: 1; transform: translateY(0); }
  .welcome-banner::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(25, 230, 255, .06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(25, 230, 255, .06) 1px, transparent 1px);
    background-size: 12px 12px; pointer-events: none; opacity: .6;
  }
  .welcome-line-1 { font-size: 9px; letter-spacing: 2px; color: #6f9cc0; font-weight: 800; z-index: 1; }
  .welcome-line-2 {
    font-size: 18px; letter-spacing: .5px; font-weight: 900; font-style: italic;
    background: linear-gradient(90deg, #ffffff, #7fdcff, #19e6ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 8px rgba(25, 230, 255, .9)) drop-shadow(0 0 2px rgba(0, 0, 0, .95));
    z-index: 1;
  }
  .welcome-line-3 { font-size: 8.5px; letter-spacing: 1.6px; color: #19e6ff; font-weight: 800; text-shadow: 0 0 6px rgba(25, 230, 255, 1); z-index: 1; }
  .welcome-banner::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #19e6ff, transparent);
  }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 900px) { :root { --hud-width: 320px; --hud-right: 14px; --hud-bottom: 100px; } }
  @media (max-width: 640px) {
    :root { --hud-width: 270px; --hud-right: 8px; --hud-bottom: 90px; }
    .chip span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<!-- ================= BOOT OVERLAY ================= -->
<div class="boot-overlay" id="bootOverlay">
  <div class="start-lights" aria-hidden="true">
    <span class="start-light"></span>
    <span class="start-light"></span>
    <span class="start-light"></span>
    <span class="start-light"></span>
    <span class="start-light"></span>
  </div>
  <div class="boot-text" id="bootText">INITIALIZING RACE CORE...</div>
  <div class="boot-progress"><div class="boot-progress-fill" id="bootProgressFill"></div></div>
  <div class="boot-stats">
    <span id="bootCpu">CPU: --%</span>
    <span id="bootMem">MEM: --%</span>
    <span id="bootNet">NET: OK</span>
  </div>
</div>

<!-- ================= WELCOME BANNER ================= -->
<div class="welcome-banner" id="welcomeBanner">
  <div class="welcome-line-1">WELCOME MESSAGE</div>
  <div class="welcome-line-2">SELAMAT DATANG, BOS</div>
  <div class="welcome-line-3">SHAQUILLE CARVINSON</div>
</div>

<!-- ================= HUD UTAMA ================= -->
<div class="scene" id="scene">
  <main class="hud" id="hud">

    <header class="hud-bar--top">
      <div class="turn-signals">
        <span class="arrow left"  id="indLeft"></span>
        <span class="arrow right" id="indRight"></span>
      </div>
      <div class="shift-lights" id="shiftLights"></div>
    </header>

    <div class="hud-bar--chips">
      <div class="chips">
        <span class="chip" id="chipEngine"><i></i><span>ENG</span></span>
        <span class="chip" id="chipLights"><i></i><span>LIGHT</span></span>
        <span class="chip" id="chipBelt"><i></i><span>BELT</span></span>
      </div>
    </div>

    <section class="gauge" id="gauge">
      <svg viewBox="0 0 400 250" aria-hidden="true">
        <defs>
          <linearGradient id="spdGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" style="stop-color:var(--c1)"/>
            <stop offset="1" style="stop-color:var(--c2)"/>
          </linearGradient>

<!-- ================= RACE GAUGE ================= -->
<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const RPM_MAX  = 8000;
  const RPM_SEGS = 40;
  const CX = 200, CY = 215;
  const SPD_R = 128;

  const fill    = document.getElementById('gFill');
  const dot     = document.getElementById('gDot');
  const ticks   = document.getElementById('gTicks');
  const rpmG    = document.getElementById('rpmSegs');
  const rpmLbl  = document.getElementById('rpmLabels');
  const shiftEl = document.getElementById('shiftLights');

  function el(name, attrs, parent) {
    const n = document.createElementNS(NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function pt(deg, r) {
    const a = deg * Math.PI / 180;
    return [CX + Math.cos(a) * r, CY + Math.sin(a) * r];
  }

  /* ---------- RPM segments (setengah lingkaran, kiri -> kanan) ---------- */
  const segs = [];
  for (let i = 0; i < RPM_SEGS; i++) {
    const deg = 180 + ((i + 0.5) / RPM_SEGS) * 180;
    const p1 = pt(deg, 146), p2 = pt(deg, 172);
    const f = i / RPM_SEGS;
    const ln = el('line', {
      x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1],
      'class': 'rseg ' + (f < 0.62 ? 'c' : f < 0.82 ? 'a' : 'r')
    }, rpmG);
    ln.style.strokeWidth = 5.2;
    segs.push(ln);
  }

  /* angka RPM x1000 */
  for (let k = 0; k <= 8; k++) {
    const p = pt(180 + (k / 8) * 180, 186);
    const t = el('text', { x: p[0], y: p[1], 'class': 'r-label' + (k >= 7 ? ' red' : '') }, rpmLbl);
    t.textContent = k;
  }

  /* ---------- LED shift light ---------- */
  const LED_N = 15;
  const leds = [];
  for (let i = 0; i < LED_N; i++) {
    const d = document.createElement('span');
    d.className = 'sl ' + (i < 5 ? 'g' : i < 10 ? 'r' : 'b');
    shiftEl.appendChild(d);
    leds.push(d);
  }

  /* ---------- speed ticks ---------- */
  let curMax = 0;
  function buildTicks(max) {
    curMax = max;
    ticks.innerHTML = '';
    const step = max / 8;
    for (let i = 0; i <= 32; i++) {
      const deg = 180 + (i / 32) * 180;
      const major = i % 4 === 0;
      const p1 = pt(deg, major ? 112 : 117), p2 = pt(deg, 122);
      el('line', {
        x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1],
        'class': 'g-tick' + (major ? ' maj' : '')
      }, ticks);
      if (major && i > 0 && i < 32) {
        const pl = pt(deg, 100);
        const t = el('text', { x: pl[0], y: pl[1], 'class': 'g-label' }, ticks);
        t.textContent = Math.round(step * (i / 4));
      }
    }
  }
  buildTicks(160);

  /* ---------- loop ---------- */
  const speedEl = document.getElementById('vSpeed');
  const unitEl  = document.getElementById('vUnit');
  const rpmEl   = document.getElementById('vRpm');
  const topEl   = document.getElementById('vTop');
  const hudEl   = document.getElementById('hud');

  let smooth = 0, smoothRpm = 0, topSpeed = 0, lastUnit = '';

  function loop() {
    const speed = parseFloat((speedEl.textContent || '').replace(/[^0-9.]/g, '')) || 0;
    const rpm   = parseInt((rpmEl.textContent || '').replace(/[^0-9]/g, ''), 10) || 0;
    const unit  = (unitEl.textContent || '').trim().toLowerCase();
    const max   = unit.indexOf('k') === 0 ? 240 : 160;

    if (max !== curMax) buildTicks(max);

    /* reset top speed kalau ganti satuan */
    if (unit !== lastUnit) { lastUnit = unit; topSpeed = 0; }
    if (speed > topSpeed) {
      topSpeed = speed;
      if (topEl) topEl.textContent = Math.round(topSpeed);
    }

    smooth    += (Math.min(1, speed / max) - smooth) * 0.16;
    smoothRpm += (Math.min(1, rpm / RPM_MAX) - smoothRpm) * 0.25;

    /* speed arc + titik ujung */
    fill.setAttribute('stroke-dasharray', (smooth * 100).toFixed(2) + ' 100');
    const dp = pt(180 + smooth * 180, SPD_R);
    dot.setAttribute('cx', dp[0].toFixed(2));
    dot.setAttribute('cy', dp[1].toFixed(2));

    /* rpm segments */
    const lit = Math.round(smoothRpm * RPM_SEGS);
    for (let i = 0; i < RPM_SEGS; i++) segs[i].classList.toggle('on', i < lit);

    /* shift lights: mulai 55% rpm, penuh 93% */
    for (let i = 0; i < LED_N; i++) {
      leds[i].classList.toggle('on', smoothRpm >= 0.55 + (i / LED_N) * 0.38);
    }

    hudEl.classList.toggle('hot', smoothRpm > 0.86);
    hudEl.classList.toggle('flash', smoothRpm > 0.95);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>


<!-- ================= MUSIC PLAYER ================= -->
<script>
(function () {
  'use strict';

  /* ====== CONFIG MUSIK ======
     1. Taruh file mp3 di folder "music" (sejajar dengan index.html)
     2. Tambahkan barisnya di PLAYLIST di bawah ini
     Kontrol: P = play/pause, N = next, B = prev, + / - = volume
  */
  const AUTO_PLAY = true;    // mulai otomatis setelah boot + welcome
  const VOLUME    = 0.4;     // 0.0 - 1.0
  const VOL_STEP  = 0.05;
  const SHUFFLE   = false;   // true = lagu berikutnya acak

  const PLAYLIST = [
    { title: 'Judul Lagu 1', artist: 'Nama Artis', src: 'music/lagu1.mp3' },
    { title: 'Judul Lagu 2', artist: 'Nama Artis', src: 'music/lagu2.mp3' },
    { title: 'Judul Lagu 3', artist: 'Nama Artis', src: 'music/lagu3.mp3' }
  ];

  const bar      = document.getElementById('musicBar');
  const stateEl  = document.getElementById('mState');
  const titleEl  = document.getElementById('mTitle');
  const artistEl = document.getElementById('mArtist');
  const fillEl   = document.getElementById('mFill');
  const timeEl   = document.getElementById('mTime');
  const volEl    = document.getElementById('mVol');
  if (!bar) return;

  const audio = new Audio();
  audio.preload = 'metadata';
  audio.volume  = VOLUME;

  let idx = 0, errors = 0, want = false, loaded = false;

  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    s = Math.floor(s);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function renderState() { stateEl.innerHTML = audio.paused ? '&#9654;' : '&#10074;&#10074;'; }
  function renderVolume() { volEl.textContent = 'VOL ' + Math.round(audio.volume * 100); }

  function load(i) {
    if (!PLAYLIST.length) return;
    idx = (i + PLAYLIST.length) % PLAYLIST.length;
    const t = PLAYLIST[idx];
    audio.src = t.src;
    loaded = true;
    titleEl.textContent  = t.title  || 'Tanpa Judul';
    artistEl.textContent = t.artist || '';
    fillEl.style.width = '0%';
    timeEl.textContent = '0:00';
  }

  function play() {
    if (!PLAYLIST.length) return;
    want = true;
    if (!loaded) load(idx);
    const p = audio.play();
    if (p && p.catch) p.catch(() => {});   // diblokir browser -> dicoba lagi saat input pertama
  }
  function pause()  { want = false; audio.pause(); }
  function toggle() { audio.paused ? play() : pause(); }

  function next() {
    if (!PLAYLIST.length) return;
    let n = idx + 1;
    if (SHUFFLE && PLAYLIST.length > 1) {
      do { n = Math.floor(Math.random() * PLAYLIST.length); } while (n === idx);
    }
    load(n);
    if (want) play();
  }
  function prev() {
    if (!PLAYLIST.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    load(idx - 1);
    if (want) play();
  }
  function setVolume(v) {
    audio.volume = Math.max(0, Math.min(1, Number(v) || 0));
    renderVolume();
  }
  function add(track) {
    if (!track || !track.src) return;
    PLAYLIST.push({ title: track.title, artist: track.artist, src: track.src });
    bar.hidden = false;
    if (!loaded) load(PLAYLIST.length - 1);
  }

  /* ====== EVENT AUDIO ====== */
  audio.addEventListener('play',  renderState);
  audio.addEventListener('pause', renderState);
  audio.addEventListener('playing', () => { errors = 0; renderState(); });
  audio.addEventListener('ended', next);
  audio.addEventListener('timeupdate', () => {
    const d = audio.duration;
    fillEl.style.width = (isFinite(d) && d > 0 ? (audio.currentTime / d) * 100 : 0).toFixed(1) + '%';
    timeEl.textContent = fmt(audio.currentTime);
  });
  audio.addEventListener('error', () => {
    errors++;
    if (errors >= PLAYLIST.length) {
      want = false;
      titleEl.textContent  = 'FILE TIDAK DITEMUKAN';
      artistEl.textContent = 'Cek folder music & PLAYLIST';
      renderState();
      return;
    }
    load(idx + 1);
    if (want) play();
  });

  /* ====== KONTROL ====== */
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    switch (e.key.toLowerCase()) {
      case 'p': toggle(); break;
      case 'n': next();   break;
      case 'b': prev();   break;
      case '=': case '+': setVolume(audio.volume + VOL_STEP); break;
      case '-': case '_': setVolume(audio.volume - VOL_STEP); break;
    }
  });

  /* kalau autoplay diblokir browser, mulai saat input pertama */
  function retryOnce() { if (want && audio.paused) play(); }
  window.addEventListener('pointerdown', retryOnce, { once: true });
  window.addEventListener('keydown',     retryOnce, { once: true });

  /* ====== API ======
     window.HudMusic.play() / pause() / toggle() / next() / prev() / setVolume(0..1)
     window.HudMusic.add({ title, artist, src })
     SendNUIMessage({ action = 'music', cmd = 'toggle' | 'play' | 'pause' | 'next' | 'prev' })
     SendNUIMessage({ action = 'music', cmd = 'volume', value = 0.5 })
     SendNUIMessage({ action = 'music', cmd = 'add', track = { title = '..', artist = '..', src = 'music/x.mp3' } })
  */
  window.HudMusic = {
    play, pause, toggle, next, prev, setVolume, add,
    autoStart: function () { if (AUTO_PLAY) play(); }
  };

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.action !== 'music') return;
    switch (d.cmd) {
      case 'play':   play();   break;
      case 'pause':  pause();  break;
      case 'toggle': toggle(); break;
      case 'next':   next();   break;
      case 'prev':   prev();   break;
      case 'volume': setVolume(d.value); break;
      case 'add':    add(d.track); break;
    }
  });

  /* ====== INIT ====== */
  if (PLAYLIST.length) {
    bar.hidden = false;
    load(0);
    renderVolume();
    renderState();
  }
})();
</script>


<!-- ================= BOOT SEQUENCE + WELCOME ================= -->
<script>
(function () {
  'use strict';

  /* ====== CONFIG ====== */
  const AUTO_BOOT       = true;   // false = matikan boot otomatis
  const BOOT_DURATION   = 5000;   // durasi boot (ms)
  const AUTO_WELCOME    = true;   // putar welcome setelah boot

  const WELCOME_TEXT    = 'Selamat datang Bos Shaquille Carvinson';
  const USE_MP3         = true;   // true = welcome.mp3, false = TTS

  /* ====== ELEMEN ====== */
  const overlay    = document.getElementById('bootOverlay');
  const textEl     = document.getElementById('bootText');
  const fillEl     = document.getElementById('bootProgressFill');
  const cpuEl      = document.getElementById('bootCpu');
  const memEl      = document.getElementById('bootMem');
  const netEl      = document.getElementById('bootNet');
  const sceneEl    = document.getElementById('scene');
  const bannerEl   = document.getElementById('welcomeBanner');
  const mp3Welcome = document.getElementById('welcomeSound');
  const startLights = document.querySelectorAll('.start-light');

  if (!overlay) return;

  /* ====== AUDIO ENGINE ====== */
  let audioCtx = null;
  function getAudio() {
    if (audioCtx) return audioCtx;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }

  function beep(freq, dur = 0.08, vol = 0.08, type = 'square', delay = 0) {
    const ctx = getAudio();
    if (!ctx) return;
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = ctx.currentTime + delay;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function sweep(f1, f2, dur = 0.4, vol = 0.05, type = 'sawtooth', delay = 0) {
    const ctx = getAudio();
    if (!ctx) return;
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    const t0 = ctx.currentTime + delay;
    osc.frequency.setValueAtTime(f1, t0);
    osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function playBootAudio() {
    /* 5 beep lampu start (tiap 20% durasi), lalu "GO" lebih tinggi + rev */
    const step = BOOT_DURATION / 1000 / 5;
    for (let i = 0; i < 5; i++) beep(440, 0.14, 0.09, 'square', i * step);
    const tEnd = BOOT_DURATION / 1000;
    beep(880, 0.45, 0.10, 'square', tEnd);
    sweep(120, 1400, 0.7, 0.05, 'sawtooth', tEnd - 0.1);
  }

  /* ====== WELCOME AUDIO ====== */
  function playWelcomeChime() {
    beep(587.33, 0.30, 0.10, 'sine', 0.00);
    beep(880.00, 0.50, 0.10, 'sine', 0.18);
    beep(1174.66, 0.20, 0.06, 'sine', 0.40);
  }

  function speakWelcome() {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(WELCOME_TEXT);
    u.lang   = 'id-ID';
    u.rate   = 0.95;
    u.pitch  = 1.05;
    u.volume = 1.0;
    const voices = speechSynthesis.getVoices();
    const idVoice = voices.find(v => /id[-_]ID/i.test(v.lang))
                 || voices.find(v => /indonesia/i.test(v.name));
    if (idVoice) u.voice = idVoice;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  let welcomeDone = false;

  function playWelcome(force) {
    if (welcomeDone && !force) return;
    welcomeDone = true;

    playWelcomeChime();

    if (bannerEl) {
      bannerEl.classList.add('show');
      setTimeout(() => bannerEl.classList.remove('show'), 4500);
    }

    setTimeout(() => {
      if (USE_MP3 && mp3Welcome) {
        mp3Welcome.currentTime = 0;
        mp3Welcome.volume = 1.0;
        mp3Welcome.play().catch(() => speakWelcome());
      } else {
        speakWelcome();
      }
    }, 550);
  }

  window.playWelcome = function () { playWelcome(true); };

  /* ====== BOOT STAGES ====== */
  const BOOT_STAGES = [
    { at:  0, text: 'INITIALIZING RACE CORE...' },
    { at: 12, text: 'WARMING UP TYRES...' },
    { at: 30, text: 'CALIBRATING SENSORS...' },
    { at: 50, text: 'ESTABLISHING TELEMETRY LINK...' },
    { at: 68, text: 'SYNCING VEHICLE DATA...' },
    { at: 85, text: 'FORMATION LAP COMPLETE...' },
    { at: 96, text: 'LIGHTS OUT!' }
  ];

  let bootTimer = null;
  let startTime = 0;
  let running   = false;

  function startBoot() {
    if (running) return;
    running = true;

    overlay.classList.remove('hide', 'go');
    sceneEl.classList.remove('hud-booted');
    startLights.forEach(l => l.classList.remove('on'));

    fillEl.style.width = '0%';
    textEl.textContent = BOOT_STAGES[0].text;
    cpuEl.textContent  = 'CPU: 0%';
    memEl.textContent  = 'MEM: 0%';
    netEl.textContent  = 'NET: OK';

    playBootAudio();
    startTime = performance.now();

    cancelAnimationFrame(bootTimer);
    function tick(now) {
      const elapsed = now - startTime;
      const pct = Math.min(100, (elapsed / BOOT_DURATION) * 100);

      fillEl.style.width = pct.toFixed(2) + '%';

      /* lampu start menyala satu per satu */
      const lightsOn = Math.min(5, Math.floor(pct / 20) + (pct >= 5 ? 1 : 0));
      startLights.forEach((l, i) => l.classList.toggle('on', i < Math.min(5, lightsOn)));

      let stage = BOOT_STAGES[0];
      for (const s of BOOT_STAGES) if (pct >= s.at) stage = s;
      if (textEl.textContent !== stage.text) {
        textEl.textContent = stage.text;
      }

      cpuEl.textContent = 'CPU: ' + Math.min(100, Math.floor(pct + Math.random() * 8)) + '%';
      memEl.textContent = 'MEM: ' + Math.min(100, Math.floor(pct * 0.85 + Math.random() * 10)) + '%';

      if (pct >= 100) { finishBoot(); return; }
      bootTimer = requestAnimationFrame(tick);
    }
    bootTimer = requestAnimationFrame(tick);
  }

  function finishBoot() {
    fillEl.style.width = '100%';
    textEl.textContent = 'GO! GO! GO!';
    cpuEl.textContent  = 'CPU: 100%';
    memEl.textContent  = 'MEM: 100%';
    netEl.textContent  = 'NET: CONNECTED';

    /* semua lampu jadi hijau */
    startLights.forEach(l => l.classList.add('on'));
    overlay.classList.add('go');

    setTimeout(() => {
      overlay.classList.add('hide');
      setTimeout(() => {
        sceneEl.classList.add('hud-booted');
        running = false;
        if (AUTO_WELCOME) setTimeout(() => playWelcome(), 400);
        /* musik mulai setelah suara welcome selesai */
        if (window.HudMusic) setTimeout(window.HudMusic.autoStart, 5200);
      }, 200);
    }, 700);
  }

  if (AUTO_BOOT) {
    if (document.readyState === 'complete') {
      setTimeout(startBoot, 300);
    } else {
      window.addEventListener('load', () => setTimeout(startBoot, 300));
    }
  }

  /* ====== TRIGGER MANUAL ======
     window.playBootSequence()  -> boot ulang
     window.playWelcome()       -> welcome saja
     SendNUIMessage({ action = 'boot' | 'welcome' })
  */
  window.playBootSequence = function () {
    running = false;
    welcomeDone = false;
    cancelAnimationFrame(bootTimer);
    startBoot();
  };

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d) return;
    if (d.action === 'boot' || d.type === 'boot') window.playBootSequence();
    if (d.action === 'welcome' || d.type === 'welcome') playWelcome(true);
  });

  /* Unlock audio */
  function unlockOnce() {
    const ctx = getAudio();
    if (ctx && ctx.state === 'suspended') ctx.resume();

    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
    }

    if (mp3Welcome) {
      mp3Welcome.volume = 0;
      mp3Welcome.play().then(() => {
        mp3Welcome.pause();
        mp3Welcome.currentTime = 0;
        mp3Welcome.volume = 1.0;
      }).catch(() => {});
    }
  }
  window.addEventListener('pointerdown', unlockOnce, { once: true });
  window.addEventListener('keydown',     unlockOnce, { once: true });

  if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = () => {};
    speechSynthesis.getVoices();
  }
})();
</script>

</body>
</html>
